# Postgres with the pgvector extension, standing in for AlloyDB as the vector store
# for the shopping assistant. This is a single-replica demo database, not an HA setup.
apiVersion: v1
kind: Secret
metadata:
  name: pgvector-credentials
  labels:
    app: pgvector
type: Opaque
stringData:
  # Local-only demo credential: the database is reachable on the cluster network and
  # nowhere else. Change it (and re-run the seeder) before using this anywhere real.
  password: onlineboutique-pgvector
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-data
  labels:
    app: pgvector
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  labels:
    app: pgvector
spec:
  replicas: 1
  strategy:
    # The PVC is ReadWriteOnce, so the old pod has to release it before the new one starts.
    type: Recreate
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # The postgres image runs as uid/gid 999; fsGroup makes the mounted volume
        # writable for it without needing a root init container.
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      containers:
      - name: postgres
        image: pgvector/pgvector:pg17
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: false
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "products"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgvector-credentials
              key: password
        - name: PGDATA
          # A subdirectory of the mount, so initdb never sees a non-empty volume root.
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            # Not pg_isready: that reports the server is accepting connections even
            # when the database itself was never created, which hides a half-finished
            # initdb behind a Ready pod.
            command: ["psql", "-U", "postgres", "-d", "products", "-c", "SELECT 1"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pgvector-data
---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
  labels:
    app: pgvector
spec:
  type: ClusterIP
  selector:
    app: pgvector
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
