apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  # Stated explicitly so that re-applying this manifest restores the Deployment after
  # something (a skaffold teardown, a manual scale) left it at zero replicas: kubectl
  # apply cannot reset a field the manifest does not carry.
  replicas: 1
  strategy:
    # Single-node clusters cannot afford the default RollingUpdate surge: maxSurge 25%
    # rounds up to 1, so a redeploy briefly runs two of these langchain processes and
    # neither finishes booting inside its probe window.
    type: Recreate
  selector:
    matchLabels:
      app: shoppingassistantservice
  template:
    metadata:
      labels:
        app: shoppingassistantservice
    spec:
      serviceAccountName: shoppingassistantservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: false
        image: shoppingassistantservice
        ports:
        - name: http
          containerPort: 8080
        env:
        # --- Inference backend -------------------------------------------------------
        # "ollama" talks to a self-hosted Ollama server. Switch to "openai" (with
        # OPENAI_BASE_URL/OPENAI_API_KEY) or "google" (with GOOGLE_API_KEY) without
        # rebuilding the image.
        - name: LLM_BACKEND
          value: "ollama"
        - name: OLLAMA_BASE_URL
          value: "http://192.168.86.62:11434"
        - name: LLM_MODEL
          value: "gemma4:latest"
        - name: EMBEDDING_MODEL
          value: "embeddinggemma:latest"
        # The reply ends with the [productID] markers the frontend turns into product
        # cards, so the limit has to leave room for them after the prose.
        - name: LLM_NUM_PREDICT
          value: "1024"
        # --- Vector store ------------------------------------------------------------
        - name: PGVECTOR_HOST
          value: "pgvector"
        - name: PGVECTOR_PORT
          value: "5432"
        - name: PGVECTOR_DATABASE
          value: "products"
        - name: PGVECTOR_USER
          value: "postgres"
        - name: PGVECTOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgvector-credentials
              key: password
        - name: PGVECTOR_COLLECTION
          value: "products"
        startupProbe:
          # Importing langchain, sqlalchemy and the client libraries takes a while on a
          # throttled core. The kubelet waits for this to pass before the liveness probe
          # can kill anything, so a slow boot is not mistaken for a hung process.
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          failureThreshold: 36   # allow up to ~3min to finish booting
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 20
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            # The langchain/sqlalchemy import graph alone needs more than the 128Mi the
            # upstream manifest allowed, and a 200m-style ceiling stretches that import
            # past any sensible probe budget.
            cpu: "1"
            memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  type: ClusterIP
  selector:
    app: shoppingassistantservice
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoppingassistantservice
# No iam.gke.io/gcp-service-account annotation: there is no Workload Identity here, and
# nothing in this deployment calls a Google Cloud API.
