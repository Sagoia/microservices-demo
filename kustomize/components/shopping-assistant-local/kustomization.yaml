# Just the two workloads the assistant needs. Turning the feature on in the frontend is
# left to the overlay, so this component can also be applied on its own -- against a
# cluster where the base app is already running and should not be restarted. See
# kustomize/overlays/shopping-assistant-only.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- pgvector.yaml
- shoppingassistantservice.yaml
