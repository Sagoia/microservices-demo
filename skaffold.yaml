apiVersion: skaffold/v3
kind: Config
metadata:
  name: app
build:
  platforms: ["linux/amd64", "linux/arm64"]
  artifacts:
  # image tags are relative; to specify an image repo (e.g. GCR), you
  # must provide a "default repo" using one of the methods described
  # here:
  # https://skaffold.dev/docs/concepts/#image-repository-handling
  - image: emailservice
    context: src/emailservice
  - image: productcatalogservice
    context: src/productcatalogservice
  - image: recommendationservice
    context: src/recommendationservice
  - image: shoppingassistantservice
    context: src/shoppingassistantservice
  - image: shippingservice
    context: src/shippingservice
  - image: checkoutservice
    context: src/checkoutservice
  - image: paymentservice
    context: src/paymentservice
  - image: currencyservice
    context: src/currencyservice
  - image: cartservice
    context: src/cartservice/src
    docker:
      dockerfile: Dockerfile
  - image: frontend
    context: src/frontend
  - image: adservice
    context: src/adservice
  tagPolicy:
    gitCommit: {}
  local:
    useDockerCLI: true
    useBuildkit: true
manifests:
  kustomize:
    paths:
    - kubernetes-manifests
deploy:
  kubectl: {}
# "gcb" profile allows building and pushing the images
# on Google Container Builder without requiring docker
# installed on the developer machine. However, note that
# since GCB does not cache the builds, each build will
# start from scratch and therefore take a long time.
#
# This is not used by default. To use it, run:
#     skaffold run -p gcb
profiles:
- name: gcb
  build:
    googleCloudBuild:
      diskSizeGb: 300
      machineType: N1_HIGHCPU_32
      timeout: 4000s
# "debug" profile replaces the default Dockerfile in cartservice with Dockerfile.debug,
# which enables debugging via skaffold.
#
# This profile is used by default when running skaffold debug.
- name: debug
  activation:
  - command: debug
  patches:
  - op: replace
    path: /build/artifacts/7/docker/dockerfile
    value: Dockerfile.debug
# The "network-policies" profile is not used by default.
# You can use it in isolation or in combination with other profiles:
#     skaffold run -p network-policies, debug
- name: network-policies
  patches:
  - op: add
    path: /manifests/kustomize/paths/1
    value: kustomize/components/network-policies
# The "arm64" profile builds natively on arm64 hosts (Windows-on-Arm, Apple Silicon).
# The Dockerfiles declare BUILDPLATFORM/TARGETARCH with amd64 defaults, and Docker does
# not auto-populate them here, so without this the builder stages run under QEMU
# emulation and emit amd64 binaries into arm64 images (exec format error at runtime).
#     skaffold run -p arm64
- name: arm64
  patches:
  - op: replace
    path: /build/platforms
    value: ["linux/arm64"]
  # Deploy through the dev overlay instead of kubernetes-manifests directly: it
  # raises the Python services' CPU ceiling and adds a startupProbe so slow boots
  # on low-core arm64 machines are not killed by the liveness probe.
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/dev-arm64
  - op: add
    path: /build/artifacts/0/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/1/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/2/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/3/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/4/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/5/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/6/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/7/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/8/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/9/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/10/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  # shoppingassistantservice is built by skaffold but NOT deployed by
  # kubernetes-manifests/kustomization.yaml, because the assistant is opt-in. Skipping
  # the build keeps the default deployment quick; the "arm64-assistant" profile below
  # builds and deploys it instead.
  # Removed last so the artifact indices above are still correct when applied.
  - op: remove
    path: /build/artifacts/3
# The "arm64-assistant" profile is the "arm64" profile plus the optional shopping
# assistant: it builds all eleven images (shoppingassistantservice included) and renders
# kustomize/overlays/shopping-assistant-local, which adds a pgvector database and turns
# the assistant on in the frontend. Inference runs on a self-hosted Ollama server, so no
# Google Cloud project is involved; see
# kustomize/components/shopping-assistant-local/README.md.
#
# Use it on its own, not combined with "arm64" -- that profile removes the
# shoppingassistantservice artifact.
#     skaffold run -p arm64-assistant
- name: arm64-assistant
  patches:
  - op: replace
    path: /build/platforms
    value: ["linux/arm64"]
  - op: add
    path: /build/artifacts/0/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/1/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/2/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/3/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/4/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/5/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/6/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/7/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/8/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/9/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: add
    path: /build/artifacts/10/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/shopping-assistant-local
# The "shopping-assistant-local" profile deploys the same overlay without forcing the
# arm64 build args, for hosts where the default platform is already correct.
#     skaffold run -p shopping-assistant-local
- name: shopping-assistant-local
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/shopping-assistant-local
---
apiVersion: skaffold/v3
kind: Config
metadata:
  name: loadgenerator
requires:
- configs:
  - app
build:
  platforms: ["linux/amd64", "linux/arm64"]
  artifacts:
  - image: loadgenerator
    context: src/loadgenerator
  local:
    useDockerCLI: true
    useBuildkit: true
manifests:
  rawYaml:
  - ./kubernetes-manifests/loadgenerator.yaml
deploy:
  kubectl: {}
profiles:
- name: gcb
  build:
    googleCloudBuild:
      diskSizeGb: 300
      machineType: N1_HIGHCPU_32
      timeout: 4000s
# The "arm64" profile builds natively on arm64 hosts (Windows-on-Arm, Apple Silicon).
# The Dockerfiles declare BUILDPLATFORM/TARGETARCH with amd64 defaults, and Docker does
# not auto-populate them here, so without this the builder stages run under QEMU
# emulation and emit amd64 binaries into arm64 images (exec format error at runtime).
#     skaffold run -p arm64
- name: arm64
  patches:
  - op: replace
    path: /build/platforms
    value: ["linux/arm64"]
  - op: add
    path: /build/artifacts/0/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
# Mirrors the "arm64" profile so `skaffold run -p arm64-assistant` also builds the
# loadgenerator natively instead of under emulation.
- name: arm64-assistant
  patches:
  - op: replace
    path: /build/platforms
    value: ["linux/arm64"]
  - op: add
    path: /build/artifacts/0/docker
    value:
      dockerfile: Dockerfile
      buildArgs:
        BUILDPLATFORM: linux/arm64
        TARGETOS: linux
        TARGETARCH: arm64
